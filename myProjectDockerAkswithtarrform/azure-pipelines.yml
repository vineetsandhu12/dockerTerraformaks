trigger:
- main

variables:
  imageRepository: 'simpleapi'
  tag: '$(Build.BuildId)'
  acrName: 'myEcommer'

stages:

- stage: Build
  displayName: Build and Push Image

  jobs:

  - job: DockerBuild

    pool:
      vmImage: ubuntu-latest

    steps:

    - checkout: self

    # Verify Dockerfile exists
    - bash: |
        echo "Current directory:"
        pwd

        echo "Files:"
        find $(Build.SourcesDirectory) -maxdepth 2 -type f
      displayName: Verify files

    
    # Build and push
    - task: Docker@2
      displayName: Build and Push Docker Image
      inputs:
        containerRegistry: 'ACR-Connection'
        repository: 'simpleapi'
        command: 'buildAndPush'
        dockerfile: '$(Build.SourcesDirectory)/myProjectDockerAkswithtarrform/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)/myProjectDockerAkswithtarrform'
        tags: |
          $(tag)
          latest